# Publishes the app (the public/ folder) as a static site on GitHub Pages.
# No server is needed: the device that creates a room hosts it in the browser.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Then push to main, or run this workflow by hand
# (Actions tab → Deploy to GitHub Pages → Run workflow).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
